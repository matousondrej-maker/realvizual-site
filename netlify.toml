[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;"
    X-Frame-Options = "SAMEORIGIN"

# Vlastní adresy sekcí – všechny servíruje index.html, sekci otevře skript podle adresy

