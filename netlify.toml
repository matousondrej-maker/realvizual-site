# Web se generuje příkazem `python3 src/build.py` do složky public/ (výstup je v gitu, Netlify nic nebuilduje)
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;"
    X-Frame-Options = "SAMEORIGIN"

# Staré adresy z doby jednostránkového webu
[[redirects]]
  from = "/videa-na-site/"
  to = "/videa-na-site"
  status = 301
